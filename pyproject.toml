[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fantasy-map-forge"
version = "0.7.3"
description = "AI fantasy map generator — procedural terrain, diffusion biome painting, vector export."
readme = "docs/architecture.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "fantasy-map-forge contributors" }]
keywords = ["fantasy", "cartography", "procedural", "diffusion", "gamedev"]

dependencies = [
    "numpy>=1.26,<2.2",
    "scipy>=1.11",
    "noise>=1.2.2",
    "pillow>=10.2",
    "pyyaml>=6.0",
    "click>=8.1",
    "onnxruntime>=1.17",
    "shapely>=2.0",
]

[project.optional-dependencies]
gui = ["PySide6>=6.6"]
dev = ["pytest>=8.0", "pytest-cov", "ruff>=0.5", "mypy>=1.10", "pre-commit"]

[project.scripts]
fmg = "fantasy_map_forge.cli:main"
fmg-gui = "fantasy_map_forge.gui:launch"
fmg-worker = "fantasy_map_forge.worker:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
strict = true
files = ["src/fantasy_map_forge/core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=fantasy_map_forge --cov-report=term-missing"